name: Release

# T40: publishes the `agentnomad` npm package when a version tag (e.g. v1.0.0) is pushed on
# main. The package is built and tested on every OS, published only after the owner
# approves the `npm` environment, through npm trusted publishing (no npm token anywhere;
# provenance is recorded), and then checked with `npx` on every OS.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancel a release half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tagged commit must have passed CI on main first (T48): a release never starts from a
  # commit whose checks failed or are still running.
  ci-passed:
    name: CI passed for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: A successful CI run exists for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count')"
          test "$count" -gt 0 || { echo "No successful CI run for $GITHUB_SHA; wait for CI on main, then tag."; exit 1; }

  verify:
    name: verify on ${{ matrix.os }}, Node ${{ matrix.node }}
    needs: ci-passed
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The lowest version the package supports is tested before publishing too (T48).
        node: ['22.13', '24']
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: The tag matches the version and is on main
        shell: bash
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag $GITHUB_REF_NAME is not v$version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "The tag is not on main"; exit 1; }

      # No dependency cache in release builds.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, format check and tests
        run: pnpm check

      - name: Build, pack and install the npm package
        shell: bash
        run: |
          pnpm release:build
          mkdir -p "$RUNNER_TEMP/package"
          npm pack ./packages/cli/release --pack-destination "$RUNNER_TEMP/package"
          npm install -g "$RUNNER_TEMP"/package/agentnomad-*.tgz

      - name: The installed command works
        shell: bash
        run: |
          test "$(agentnomad --version)" = "${GITHUB_REF_NAME#v}"
          agentnomad --help > /dev/null

      - name: End-to-end with the installed package
        shell: bash
        run: |
          export E2E_CLI="$(npm root -g)/agentnomad/dist/agentnomad.js"
          pnpm --filter @agentnomad/e2e run e2e

      # The Linux build is the one published: the exact bytes that were tested.
      - name: Keep the tested package
        if: runner.os == 'Linux' && matrix.node == '24'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/package/agentnomad-*.tgz
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Waits for the owner's approval (Settings → Environments → npm → required reviewers).
    environment:
      name: npm
      url: https://www.npmjs.com/package/agentnomad
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer (npm's docs). An exact version, so this
      # job, which can publish, never runs an npm release nobody chose (T48).
      - name: npm new enough for trusted publishing
        shell: bash
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || npm install -g npm@11.20.0
          npm --version

      - name: Get the tested package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package

      # "./" matters: without it npm reads "package/x.tgz" as a GitHub owner/repo.
      - name: Publish with provenance
        shell: bash
        run: npm publish ./package/agentnomad-*.tgz --access public --provenance

  check-published:
    name: npx on ${{ matrix.os }}, Node ${{ matrix.node }}
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13', '24']
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # npm's CDN can serve the old version list for several minutes after a publish (1.0.1
      # took over 2.5 minutes on some runners), so wait up to 10 minutes; show npx's own error
      # if it still fails.
      - name: npx agentnomad works
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 20); do
            if output="$(npx --yes "agentnomad@$version" --version 2>&1)" && [ "$output" = "$version" ]; then
              echo "npx agentnomad@$version --version: $version"
              npx --yes "agentnomad@$version" agents
              exit 0
            fi
            echo "Not available yet (attempt $attempt of 20); waiting 30 s"
            sleep 30
          done
          echo "Last npx output:"
          echo "$output"
          exit 1

      - name: Provenance and signatures verify
        if: matrix.node == '24'
        shell: bash
        run: |
          mkdir check && cd check
          npm init -y > /dev/null
          npm install "agentnomad@${GITHUB_REF_NAME#v}"
          npm audit signatures
